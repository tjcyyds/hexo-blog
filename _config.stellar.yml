# Stellar 主题自定义配置(仿 Thun888 风格)
# 文档: https://xaoxuu.com/wiki/stellar/theme-settings/

# 左上角 logo 区(头像 + 标题 + 副标题)
logo:
  avatar: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/avatar/round/3442075.svg
  title: '[每日记录](/)'
  subtitle: 每天记录一点 | 见证成长

# 侧边栏主功能导航菜单(仿 Thun888 的彩色图标菜单)
# 颜色完全对齐 Thun888: 博客青/归档绿/标签红/关于橙
menubar:
  items:
    - id: post
      theme: '#1bcdfc'
      icon: solar:documents-bold-duotone
      title: 博客
      url: /
    - id: archives
      theme: '#3dc550'
      icon: solar:notebook-bookmark-bold-duotone
      title: 归档
      url: /archives/
    - id: tags
      theme: '#f44336'
      icon: solar:tag-bold-duotone
      title: 标签
      url: /tags/
    - id: about
      theme: '#fa6400'
      icon: solar:user-id-bold-duotone
      title: 关于
      url: /about/

# 注入: 仿 Thun888 的动态粒子背景 + 透明化 body 让背景透出
inject:
  head:
    - |
      <style>
      body { background: transparent !important; }
      #thun-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; }

      /* 侧边栏菜单：只显示图标，横向排列（彻底覆盖主题原 column 布局） */
      .l_left .nav-area { overflow: visible; }
      .l_left .nav-area .menu {
        display: flex !important;
        flex-direction: row !important;
        flex-wrap: nowrap !important;
        justify-content: center !important;
        align-items: center;
        gap: 6px !important;
        padding: 10px 0 14px;
        margin: 0 auto !important;
        width: max-content !important;
        max-width: 100%;
      }
      .l_left .nav-area .menu .nav-item {
        position: relative;
        flex: 0 0 auto !important;
        box-sizing: border-box;
        width: 34px !important;
        height: 34px !important;
        min-height: 0 !important;
        padding: 0 !important;
        gap: 0 !important;
        border-radius: 10px;
        transition: all .25s ease;
        background: rgba(255,255,255,.5);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,.45);
        color: #4a5568;
        opacity: 1 !important;
        justify-content: center !important;
      }
      .l_left .nav-area .menu .nav-item:hover {
        background: rgba(255,255,255,.85);
        transform: translateY(-2px);
        opacity: 1 !important;
      }
      .l_left .nav-area .menu .nav-item > span:not(.active-dot) {
        display: none !important;
      }
      .l_left .nav-area .menu .nav-item .icon,
      .l_left .nav-area .menu .nav-item svg,
      .l_left .nav-area .menu .nav-item img {
        width: 18px !important;
        height: 18px !important;
        min-width: 18px;
        min-height: 18px;
        margin: 0 !important;
        opacity: 1 !important;
        color: #4a5568;
        fill: #4a5568;
        transition: color .25s ease;
      }
      .l_left .nav-area .menu .nav-item.active {
        background: var(--item-theme);
        box-shadow: 0 3px 10px color-mix(in srgb, var(--item-theme) 45%, transparent);
        color: #fff !important;
        opacity: 1 !important;
      }
      .l_left .nav-area .menu .nav-item.active .icon,
      .l_left .nav-area .menu .nav-item.active svg,
      .l_left .nav-area .menu .nav-item.active img {
        color: #fff !important;
        fill: #fff !important;
      }
      .l_left .nav-area .menu .nav-item .active-dot {
        position: absolute;
        bottom: 4px;
        right: 4px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 0 1.5px var(--item-theme);
      }
      </style>
    # 仿 Thun888「主题改动小记」的 DIY 样式: 运行时间/复制提醒/过期提醒/烟花
    - |
      <style>
      /* 运行时间(页脚) */
      .site-runtime { font-size: 12px; opacity: .7; margin-top: 6px; }
      /* 复制提醒 toast */
      .copy-toast { position: fixed; left: 50%; top: 22px; transform: translateX(-50%) translateY(-16px);
        background: rgba(20,20,30,.92); color: #fff; padding: 8px 16px; border-radius: 8px;
        font-size: 13px; opacity: 0; transition: .3s; z-index: 9999; pointer-events: none; }
      .copy-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      /* 文章过期提醒 */
      .expire-note { margin-bottom: 18px; }
      /* 烟花画布(覆盖在最上层, 不拦截点击) */
      #firework-canvas { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
      </style>
  script:
    - |
      <script>
      (function(){
        var canvas = document.createElement('canvas');
        canvas.id = 'thun-bg';
        document.body.appendChild(canvas);
        var ctx = canvas.getContext('2d');
        var colors = ['#1bcdfc','#3dc550','#f44336','#fa6400'];
        var w,h,particles=[];
        function resize(){ w=canvas.width=window.innerWidth; h=canvas.height=window.innerHeight; }
        function init(){
          particles=[];
          var count=Math.min(90, Math.floor(w*h/16000));
          for(var i=0;i<count;i++){
            particles.push({
              x:Math.random()*w, y:Math.random()*h,
              vx:(Math.random()-0.5)*0.4, vy:(Math.random()-0.5)*0.4,
              r:Math.random()*1.8+0.6,
              c:colors[Math.floor(Math.random()*colors.length)]
            });
          }
        }
        function draw(){
          ctx.clearRect(0,0,w,h);
          for(var i=0;i<particles.length;i++){
            var p=particles[i];
            p.x+=p.vx; p.y+=p.vy;
            if(p.x<0||p.x>w) p.vx*=-1;
            if(p.y<0||p.y>h) p.vy*=-1;
            ctx.beginPath();
            ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
            ctx.fillStyle=p.c; ctx.globalAlpha=0.65; ctx.fill();
            for(var j=i+1;j<particles.length;j++){
              var q=particles[j];
              var dx=p.x-q.x, dy=p.y-q.y;
              var d=Math.sqrt(dx*dx+dy*dy);
              if(d<120){
                ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y);
                ctx.strokeStyle=p.c; ctx.globalAlpha=0.12*(1-d/120); ctx.lineWidth=1; ctx.stroke();
              }
            }
          }
          ctx.globalAlpha=1;
          requestAnimationFrame(draw);
        }
        resize(); init(); draw();
        window.addEventListener('resize', function(){ resize(); init(); });
      })();
      </script>
    # 仿 Thun888「主题改动小记」DIY 四件套: 运行时间 / 复制提醒 / 过期提醒 / 烟花
    - |
      <script>
      (function(){
        /* ===== 1. 运行时间(仿 Thun888 的「已运行 X 天」) ===== */
        // ↓↓↓ 把下面这个日期改成你的建站日期即可 ↓↓↓
        var SITE_START = new Date("2026-08-13T00:00:00");
        function pad(n){ return n < 10 ? '0' + n : '' + n; }
        var rt = document.createElement('div');
        rt.className = 'site-runtime';
        var footer = document.querySelector('footer.page-footer');
        if (footer) { footer.appendChild(rt); }
        function tickRuntime(){
          var diff = Date.now() - SITE_START.getTime();
          if (diff < 0) diff = 0;
          var d = Math.floor(diff / 86400000);
          var h = Math.floor(diff % 86400000 / 3600000);
          var m = Math.floor(diff % 3600000 / 60000);
          var s = Math.floor(diff % 60000 / 1000);
          rt.textContent = '本站已运行 ' + d + ' 天 ' + pad(h) + ' 时 ' + pad(m) + ' 分 ' + pad(s) + ' 秒';
        }
        tickRuntime(); setInterval(tickRuntime, 1000);

        /* ===== 2. 复制提醒(复制文字弹提示) ===== */
        function showCopyToast(msg){
          var t = document.getElementById('copy-toast');
          if (!t) { t = document.createElement('div'); t.id = 'copy-toast'; t.className = 'copy-toast'; document.body.appendChild(t); }
          t.textContent = msg; t.classList.add('show');
          clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('show'); }, 1800);
        }
        document.addEventListener('copy', function(){
          var sel = window.getSelection();
          if (sel && sel.toString().length > 10) { showCopyToast('内容已复制，请注明出处 ~'); }
        });

        /* ===== 3. 文章过期提醒(超过 180 天显示橙框) ===== */
        var content = document.querySelector('.md-text.content');
        if (content) {
          var times = document.querySelectorAll('time[datetime]');
          if (times.length) {
            var last = times[times.length - 1];
            var dt = new Date(last.getAttribute('datetime'));
            if (!isNaN(dt.getTime())) {
              var days = Math.floor((Date.now() - dt.getTime()) / 86400000);
              if (days > 180) {
                var box = document.createElement('div');
                box.className = 'tag-plugin colorful note expire-note';
                box.setAttribute('color', 'orange');
                box.innerHTML = '<div class="title"><strong>提醒</strong></div>'
                  + '<div class="body"><p>本文最后更新于 ' + days + ' 天前，其中某些信息可能已经过时，请谨慎使用！'
                  + '<br>如果发现内容有误，请在评论区告知。</p></div>';
                content.insertBefore(box, content.firstChild);
              }
            }
          }
        }

        /* ===== 4. 烟花特效(点击任意处放烟花) ===== */
        var fw = document.createElement('canvas');
        fw.id = 'firework-canvas';
        document.body.appendChild(fw);
        var fctx = fw.getContext('2d');
        var FW, FH, fps = [];
        function fwResize(){ FW = fw.width = window.innerWidth; FH = fw.height = window.innerHeight; }
        fwResize(); window.addEventListener('resize', fwResize);
        function burst(x, y){
          var hue = Math.floor(Math.random() * 360);
          for (var i = 0; i < 30; i++) {
            var a = Math.PI * 2 * i / 30;
            var sp = Math.random() * 4 + 2;
            fps.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, hue: hue });
          }
        }
        document.addEventListener('click', function(e){ burst(e.clientX, e.clientY); });
        function fwLoop(){
          fctx.clearRect(0, 0, FW, FH);
          for (var i = fps.length - 1; i >= 0; i--) {
            var p = fps[i];
            p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= 0.012;
            if (p.life <= 0) { fps.splice(i, 1); continue; }
            fctx.beginPath(); fctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
            fctx.fillStyle = 'hsla(' + p.hue + ',100%,60%,' + p.life + ')';
            fctx.fill();
          }
          requestAnimationFrame(fwLoop);
        }
        fwLoop();
      })();
      </script>

