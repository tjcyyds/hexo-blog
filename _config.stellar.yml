# Stellar 主题自定义配置(仿 Thun888 风格)
# 文档: https://xaoxuu.com/wiki/stellar/theme-settings/

# 左上角 logo 区(头像 + 标题 + 副标题)
logo:
  avatar: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/avatar/round/3442075.svg
  title: '[每日记录](/)'
  subtitle: 每天记录一点 | 见证成长

# 侧边栏主功能导航菜单(仿 Thun888 的彩色图标菜单)
# 颜色完全对齐 Thun888: 博客青/归档绿/标签红/关于橙
menubar:
  items:
    - id: post
      theme: '#1bcdfc'
      icon: solar:documents-bold-duotone
      title: 博客
      url: /
    - id: archives
      theme: '#3dc550'
      icon: solar:notebook-bookmark-bold-duotone
      title: 归档
      url: /archives/
    - id: tags
      theme: '#f44336'
      icon: solar:tag-bold-duotone
      title: 标签
      url: /tags/
    - id: about
      theme: '#fa6400'
      icon: solar:user-id-bold-duotone
      title: 关于
      url: /about/

# 注入: 仿 Thun888 的动态粒子背景 + 透明化 body 让背景透出
inject:
  head:
    - <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css">
    # 今日诗词：加载 jinrishici SDK（自托管，放博客自身 /hexo-blog/js/ 下，不依赖第三方 CDN）
    - <script src="/hexo-blog/js/jinrishici.js" charset="utf-8"></script>
    # 今日诗词：首页 banner 下方居中显示一句古诗
    - |
      <style>
      #jrsc-poem {
        margin: 14px auto 18px;
        max-width: 92%;
        text-align: center;
        font-family: "LXGW WenKai Screen", KaiTi, STKaiti, serif;
        font-size: 1.05em;
        color: #4a5560;
        opacity: 0;
        transition: opacity .8s ease;
      }
      #jrsc-poem.show { opacity: 1; }
      #jrsc-poem .author { font-size: .78em; opacity: .65; margin-left: 8px; }
      /* 移动端(<667px, Stellar 真实断点 $device-mobile-max)隐藏诗词：此时整页单卡片，无合适位置 */
      @media (max-width: 667px) { #jrsc-poem { display: none; } }
      </style>
    - |
